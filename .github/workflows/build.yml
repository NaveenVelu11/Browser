name: Build & Publish DeerOne Browser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean & Build APKs
        run: ./gradlew clean assembleDebug assembleRelease -x lint --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p output_apks
          cp app/build/outputs/apk/debug/*.apk output_apks/DeerOne-Browser-v1.0.0-Debug.apk || true
          cp app/build/outputs/apk/release/*.apk output_apks/DeerOne-Browser-v1.0.0-Release.apk || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeerOne-Browser-Debug
          path: output_apks/DeerOne-Browser-v1.0.0-Debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeerOne-Browser-Release
          path: output_apks/DeerOne-Browser-v1.0.0-Release.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          gh release create v1.0.0 \
            --title "DeerOne Browser v1.0.0 Release" \
            --notes "## 🚀 DeerOne Browser v1.0.0 Official Release

            - **Ultra-Fast & Modern Android Browsing**
            - Complete UI redesign with Top Floating Toolbar and Glassmorphism accents.
            - Built-in Ad & Tracker Shields, Media Sniffer Engine, SSL Inspector.
            - Integrated 5 Themes: Light, Dark, AMOLED (Pitch Black), System Default, Glass Dark.
            - Fixed Twitter/X and modern web rendering compatibility." \
            --latest || true
          
          # Retry loop for uploading assets to handle transient GitHub 503/429 errors
          for i in {1..5}; do
            echo "Attempt $i of 5: Uploading release assets..."
            if gh release upload v1.0.0 \
              output_apks/DeerOne-Browser-v1.0.0-Debug.apk \
              output_apks/DeerOne-Browser-v1.0.0-Release.apk \
              --clobber; then
              echo "Release assets uploaded successfully!"
              break
            else
              echo "Upload failed on attempt $i. Retrying in 10 seconds..."
              sleep 10
            fi
            if [ $i -eq 5 ]; then
              echo "Error: Upload failed after 5 attempts."
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
